[package]
name = "source-span"
version = "3.0.0"
authors = ["Timothée Haudebourg <author@haudebourg.net>"]
edition = "2018"
categories = ["parsing"]
keywords = ["source", "code", "map", "span"]
description = "Source code mapping and display utilities."
repository = "https://github.com/timothee-haudebourg/source-span"
documentation = "https://docs.rs/source-span"
license = "MIT OR Apache-2.0"
readme = "README.md"

[features]
default = ["crossterm", "async"]
crossterm = ["colors", "dep:crossterm", "colors-backend"]
termion = ["colors", "dep:termion", "colors-backend"]
colors = []
colors-backend = []
async = ["dep:tokio", "dep:tokio-stream", "tokio/macros", "tokio/rt"]


[dependencies]
crossterm = { version = "0.29.0", optional = true }
termion = { version = "1.5", optional = true }
tokio = { version = "1.54", optional = true }
tokio-stream = { version = "0.1.19", optional = true }

[dev-dependencies]
utf8-decode = "1.0"

# cargo all-features <check/test>
[package.metadata.cargo-all-features]
skip_optional_dependencies = true
skip_feature_sets = [["termion", "crossterm"]]
denylist = ["colors-backend"]
